<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Script en JavaScript para forzar la redirección automática a HTTPS en emmacook.cl -->
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            location.replace(`https://${location.hostname}${location.pathname}${location.search}`);
        }
    </script>

    <title>Emmacook - Pastelería</title>

    <style>
        /* Estilos generales del sitio */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            color: #333;
        }

        /* Encabezado */
        header {
            background-color: #ffffff;
            text-align: center;
            padding: 25px;
            border-bottom: 2px solid #f0f0f0;
        }

        h1.titulo-marca {
            margin: 0;
            color: #d81b60;
            font-size: 30px;
        }

        /* Contenedor de la galería */
        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Tarjetas de productos */
        .producto {
            background: #ffffff;
            border: 1px solid #eee;
            border-radius: 10px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .producto img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .info {
            padding: 15px;
        }

        .info h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .info p {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .precio {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            display: block;
            margin-bottom: 15px;
        }

        /* Botón estilo WhatsApp */
        .btn-pedir {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .btn-pedir:hover {
            background-color: #128c7e;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="titulo-marca">Emmacook Pastelería</h1>
    </header>

    <main class="galeria">
        <div class="producto">
            <img src="1000336862.png" alt="Especialidad Emmacook">
            <div class="info">
                <h3>Especialidad del Día</h3>
                <p>Deliciosa preparación artesanal.</p>
                <span class="precio">$4.500</span>
                <button class="btn-pedir" onclick="enviarPedido('Especialidad del Día', 4500)">Pedir por WhatsApp</button>
            </div>
        </div>
    </main>

    <!-- Código JavaScript para pedidos a WhatsApp -->
    <script>
        /**
         * Redirige al cliente al chat de WhatsApp con el producto solicitado.
         * @param {string} nombreProducto - Título de la preparación.
         * @param {number} precio - Valor del producto.
         */
        function enviarPedido(nombreProducto, precio) {
            const telefono = "569XXXXXXXX"; // Ingresa aquí tu número telefónico
            const texto = `Hola Emmacook! Quisiera pedir: ${nombreProducto} ($${precio})`;
            const url = `https://api.whatsapp.com/send?phone=${telefono}&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
